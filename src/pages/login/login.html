<section class="page-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6">
        <div class="page-panel p-4 p-md-5">
          <p class="page-kicker mb-2">Login</p>
          <h1 class="h3 fw-bold mb-4">Sign in</h1>
          <form class="vstack gap-3" data-login-form>
            <div>
              <label class="form-label" for="loginEmail">Email</label>
              <input class="form-control" id="loginEmail" name="email" type="email" placeholder="demo@example.com" />
            </div>
            <div>
              <label class="form-label" for="loginPassword">Password</label>
              <input class="form-control" id="loginPassword" name="password" type="password" placeholder="Password" />
            </div>
            <button class="btn btn-primary btn-lg" type="submit">Login</button>
          </form>
          <p class="small text-secondary mt-3 mb-0" data-login-status>
            Authentication wiring can be added later.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
