<section class="page-section">
  <div class="container">
    <div class="row justify-content-center py-4 py-md-5">
      <div class="col-12 col-md-10 col-lg-7 col-xl-6">
        <div class="login-header text-center mb-4 mb-md-5">
          <h1 class="h3 fw-bold mb-0">Sign in</h1>
        </div>
        <div class="page-panel login-card p-4 p-md-5">
          <form class="vstack gap-4" data-login-form>
            <div>
              <label class="form-label mb-2" for="loginEmail">Email</label>
              <input class="form-control form-control-lg" id="loginEmail" name="email" type="email" placeholder="demo@example.com" />
            </div>
            <div>
              <label class="form-label mb-2" for="loginPassword">Password</label>
              <input class="form-control form-control-lg" id="loginPassword" name="password" type="password" placeholder="Password" />
            </div>
            <button class="btn btn-primary btn-lg py-3" type="submit">Login</button>
          </form>
          <p class="small text-secondary mt-4 mb-0 text-center" data-login-status>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
