<div class="container mt-4">
  <h1>Admin Panel</h1>
  
  <ul class="nav nav-tabs" id="adminTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="tours-tab" data-bs-toggle="tab" data-bs-target="#tours" type="button" role="tab" aria-controls="tours" aria-selected="true">Tours</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="profiles-tab" data-bs-toggle="tab" data-bs-target="#profiles" type="button" role="tab" aria-controls="profiles" aria-selected="false">Guide Profiles</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="expenses-tab" data-bs-toggle="tab" data-bs-target="#expenses" type="button" role="tab" aria-controls="expenses" aria-selected="false">Expense Reports</button>
    </li>
  </ul>
  
  <div class="tab-content" id="adminTabContent">
    <!-- Tours Tab -->
    <div class="tab-pane fade show active" id="tours" role="tabpanel" aria-labelledby="tours-tab">
      <div class="d-flex justify-content-between align-items-center mt-3">
        <h2 class="mb-0">All Tours</h2>
        <button type="button" class="btn btn-primary" id="add-tour-button">Add Tour</button>
      </div>
      <div id="tours-loading" class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="table-responsive" id="tours-container" style="display: none;">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Tour Name</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Status</th>
              <th>Guest Count</th>
              <th>Allocated Guides</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tours-list"></tbody>
        </table>
      </div>
      <div id="tours-error" class="alert alert-danger d-none"></div>
    </div>
    
    <!-- Guide Profiles Tab -->
    <div class="tab-pane fade" id="profiles" role="tabpanel" aria-labelledby="profiles-tab">
      <h2 class="mt-3">All Guide Profiles</h2>
      <div id="profiles-loading" class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="table-responsive" id="profiles-container" style="display: none;">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Display Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Bio</th>
            </tr>
          </thead>
          <tbody id="profiles-list"></tbody>
        </table>
      </div>
      <div id="profiles-error" class="alert alert-danger d-none"></div>
    </div>
    
    <!-- Expense Reports Tab -->
    <div class="tab-pane fade" id="expenses" role="tabpanel" aria-labelledby="expenses-tab">
      <h2 class="mt-3">All Expense Reports</h2>
      <div id="expenses-loading" class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div class="table-responsive" id="expenses-container" style="display: none;">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Memo</th>
              <th>Transaction Date</th>
              <th>Amount</th>
              <th>Currency</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="expenses-list"></tbody>
        </table>
      </div>
      <div id="expenses-error" class="alert alert-danger d-none"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Tour Modal -->
<div class="modal fade" id="tour-modal" tabindex="-1" aria-labelledby="tour-modal-label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="tour-form">
        <div class="modal-header">
          <h5 class="modal-title" id="tour-modal-label">Add Tour</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="tour-id">
          <div class="mb-3">
            <label for="tour-name" class="form-label">Tour Name</label>
            <input type="text" class="form-control" id="tour-name" required>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label for="start-date" class="form-label">Start Date</label>
              <input type="date" class="form-control" id="start-date" required>
            </div>
            <div class="col mb-3">
              <label for="end-date" class="form-label">End Date</label>
              <input type="date" class="form-control" id="end-date" required>
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" required>
                <option value="not_started">Not Started</option>
                <option value="in_progress">In Progress</option>
                <option value="finished">Finished</option>
              </select>
            </div>
            <div class="col mb-3">
              <label for="guest-count" class="form-label">Guest Count</label>
              <input type="number" class="form-control" id="guest-count" min="0" value="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="allocated-guides" class="form-label">Allocated Guides (max 3)</label>
            <select class="form-select" id="allocated-guides" multiple size="6"></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Tour</button>
        </div>
      </form>
    </div>
  </div>
</div>
